version: '3.8'

services:
  web:
    build: .
    container_name: aset_disdik_web
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: root
      DB_NAME: asetdisdik
      BASE_URL: http://localhost:8080
    volumes:
      - ./img:/var/www/html/img
      - ./file:/var/www/html/file
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mariadb:10.5
    container_name: aset_disdik_db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: asetdisdik
    volumes:
      - db_data:/var/lib/mysql
      - ./config/asetdisdik.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: aset_disdik_pma
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db
    restart: unless-stopped

volumes:
  db_data:

